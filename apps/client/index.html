<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0e16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Allez Robert !</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Police de l'interface (locale, public/fonts) : aussi pour l'écran de chargement. */
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2'); }
      /* Écran de chargement affiché avant le code du jeu (mis à jour ensuite par main.ts). */
      html, body { margin: 0; height: 100%; background: #0a0e16; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      /* Écran tactile : pas de défilement ni de zoom de la page sous la scène 3D. */
      #scene { touch-action: none; }
      #splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; color: #f5f7fa;
        font-family: 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: radial-gradient(ellipse at 70% 30%, rgba(255, 196, 92, 0.22), transparent 55%), linear-gradient(180deg, #1a2333 0%, #0a0e16 70%);
        transition: opacity 0.5s ease; }
      #splash.out { opacity: 0; pointer-events: none; }
      /* Fond vidéo du menu (au-dessus de la 3D, sous l'interface). */
      #menu-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
      #menu-bg.on { opacity: 1; }
      #menu-still { position: absolute; inset: 0; background: #0a0e16 center / cover no-repeat; pointer-events: none; }
      /* Attente du paysage à la demande. */
      /* Halo chaud de l'écran de démarrage, translucide : visible sur fond noir, discret sur la vidéo du menu. */
      .world-wait { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: radial-gradient(ellipse at 70% 30%, rgba(255, 196, 92, 0.2), transparent 55%), linear-gradient(180deg, rgba(26, 35, 51, 0.55) 0%, rgba(6, 9, 15, 0.62) 70%); backdrop-filter: blur(4px);
        font-family: 'Inter Variable', Inter, system-ui, sans-serif; color: #e6ebf2; }
      /* Écran d'attente : Robert, la barre et le texte posés directement sur le fond de la page. */
      .world-wait-box { width: min(340px, 80vw); text-align: center; font-size: 14px; }
      .world-wait-bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin-bottom: 14px; }
      .world-wait-bar i { display: block; width: 35%; height: 100%; background: #ffd23f; border-radius: 3px; animation: ww 1.1s ease-in-out infinite; }
      @keyframes ww { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
      /* Robert sur son vélo, au-dessus de la barre (src/ui/waitBike.ts). */
      .world-wait-bike { display: block; width: auto; height: 210px; margin: -4px auto 14px; }
      /* Robert qui pédale : calques de robert-attente-velo.png (tools/robert-attente/layers.py), animés uniquement en
         transform pour tourner hors du fil principal (la page est bloquée pendant la compilation des shaders).
         Un tour de pédalier = 0,9 s : la jambe descend, le vélo penche du côté opposé, le buste contre, le poing bat. */
      .rb { position: relative; aspect-ratio: 259 / 468; }
      .rb div, .rb img { position: absolute; inset: 0; width: 100%; height: 100%; will-change: transform; }
      .rb-bike { transform-origin: 50.2% 99.4%; animation: rb-bike 0.9s ease-in-out infinite; }
      .rb-leg { transform-origin: 29% 71.4%; animation: rb-leg 0.9s ease-in-out infinite; }
      .rb-upper { transform-origin: 32.8% 61.5%; animation: rb-upper 0.9s ease-in-out infinite; }
      .rb-arm { transform-origin: 68.7% 45.9%; animation: rb-arm 0.9s ease-in-out infinite; }
      @keyframes rb-bike { 0%, 100% { transform: rotate(-1.8deg); } 50% { transform: rotate(1.8deg) translateY(-0.4%); } }
      @keyframes rb-leg { 0%, 100% { transform: none; } 50% { transform: translateY(1.8%) rotate(-1deg); } }
      @keyframes rb-upper { 0%, 100% { transform: rotate(2.2deg); } 25%, 75% { transform: translateY(-0.6%); } 50% { transform: rotate(-2.2deg); } }
      @keyframes rb-arm { 0%, 100% { transform: none; } 35% { transform: rotate(-8deg); } 60% { transform: rotate(2deg); } }
      /* Style jeu vidéo : Robert en low poly (tools/robert-attente/README.md) ; mêmes mouvements, pivots de ses calques.
         Le home trainer est au sol : le vélo penche moins. */
      .rb.rb-lp { aspect-ratio: 284 / 460; }
      .rb-lp .rb-bike { transform-origin: 38.5% 98.6%; animation-name: rb-bike-lp; }
      .rb-lp .rb-leg { transform-origin: 38.5% 69.6%; }
      .rb-lp .rb-upper { transform-origin: 36% 61.8%; }
      .rb-lp .rb-arm { transform-origin: 71.7% 44.5%; }
      @keyframes rb-bike-lp { 0%, 100% { transform: rotate(-0.8deg); } 50% { transform: rotate(0.8deg) translateY(-0.3%); } }
      @media (prefers-reduced-motion: reduce) { .rb div, .rb img { animation: none; } }
      /* Phrase qui défile sous le texte d'avancement (écran de sortie seulement : vide ailleurs). */
      .world-wait-tip { display: block; min-height: 2.6em; margin-top: 16px; font-size: 12.5px; line-height: 1.3; color: rgba(230, 235, 242, 0.62); transition: opacity 0.35s ease; }
      .world-wait-tip:empty { display: none; }
      .world-wait-box > span { display: block; font-variant-numeric: tabular-nums; }
      #splash .box { width: min(900px, 92vw); position: relative; top: -7vh; text-align: center; }
      #splash .splash-rb { height: clamp(120px, 24vh, 190px); margin: 0 auto 10px; }
      #splash h1 { margin: 0; font-size: clamp(54px, 6.4vw, 112px); font-weight: 900; letter-spacing: -0.035em; line-height: 0.95; }
      #splash h1 em { color: #ffd23f; font-style: normal; }
      #splash p { margin: 14px 0 28px; color: #c3cddb; font-size: clamp(16px, 1.5vw, 24px); font-weight: 600; letter-spacing: 0.01em; }
      #splash .bar, #splash .step { width: min(460px, 86vw); margin-left: auto; margin-right: auto; }
      #splash .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      #splash .bar i { display: block; height: 100%; width: 4%; border-radius: 3px; background: #ffd23f; transition: width 0.4s ease; }
      #splash .step { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: #c9d1db; }
      #splash .step span:last-child { color: #9aa5b1; font-variant-numeric: tabular-nums; }
      #splash .road { position: absolute; left: 0; right: 0; bottom: 0; height: 32vh; pointer-events: none;
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.35)), conic-gradient(from 180deg at 50% 0%, transparent 160deg, #222a36 172deg, #2b3442 180deg, #222a36 188deg, transparent 200deg);
        -webkit-mask: linear-gradient(180deg, transparent, #000 40%); mask: linear-gradient(180deg, transparent, #000 40%); }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="menu-still" hidden></div>
      <video id="menu-bg" muted loop playsinline preload="auto" hidden></video>
      <div id="hud" class="hud"></div>
      <div id="ui" class="ui"></div>
    </div>
    <div id="splash" role="status" aria-live="polite">
      <div class="road"></div>
      <div class="box">
        <div class="world-wait-bike rb splash-rb" aria-hidden="true"><div class="rb-bike"><img src="/robert-velo/base.webp" alt=""><img class="rb-leg" src="/robert-velo/leg.webp" alt=""><div class="rb-upper"><img src="/robert-velo/upper.webp" alt=""><img class="rb-arm" src="/robert-velo/arm.webp" alt=""></div></div></div>
        <h1>Allez <em>Robert</em> !</h1>
        <p>Rouler ensemble, chacun chez soi.</p>
        <div class="bar"><i id="splash-bar"></i></div>
        <div class="step"><span id="splash-step">Chargement du jeu…</span><span id="splash-pct">4 %</span></div>
      </div>
    </div>
    <script>
      // Écran de chargement : Robert en low poly si le style jeu vidéo est choisi (voir src/engine/style.ts).
      try {
        const q = new URLSearchParams(location.search).get('style') || localStorage.getItem('ar.style');
        if (q === 'lowpoly') document.querySelectorAll('.splash-rb img').forEach((i) => (i.src = i.src.replace('/robert-velo/', '/robert-velo-poly/')));
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
