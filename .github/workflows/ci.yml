# Intégration continue : vérification des types, tests (dont l'API sur un vrai PostgreSQL),
# builds web, puis images Docker (serveur, web, renderer) publiées sur GHCR depuis main.
# Aucun secret dans le dépôt : la publication utilise le GITHUB_TOKEN fourni par Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Types, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ar
          POSTGRES_PASSWORD: ar
          POSTGRES_DB: ar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ar -d ar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Vérification des types
        run: pnpm -r --if-present typecheck

      - name: Tests (vitest)
        run: pnpm vitest run
        env:
          # Les tests d'API tournent aussi sur un vrai PostgreSQL (sinon pg-mem).
          TEST_DATABASE_URL: postgres://ar:ar@localhost:5432/ar_test

      - name: Build du jeu
        run: pnpm --filter @allezrobert/client build

      - name: Build de l'appli compagnon
        run: pnpm --filter @allezrobert/companion build

  docker:
    name: Image ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, web, renderer]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/allezrobert-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build${{ env.PUSH == 'true' && ' et publication' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
